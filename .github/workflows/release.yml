name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v, for example 1.2.3"
        required: true
        type: string
      zenodo:
        description: "Upload and publish to Zenodo after release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Release Version and Branch
        id: version
        env:
          APP_VERSION: ${{ inputs.version }}
        shell: python
        run: |
          import os
          from pathlib import Path
          import re
          import subprocess
          import tomllib

          version = os.environ["APP_VERSION"]
          match = re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?P<pre>(?:a|b|rc)[0-9]+)?", version)
          if match is None:
              raise SystemExit("Use a version such as 5.0.0 or 5.0.0a1, without a leading v.")
          is_prerelease = match["pre"] is not None
          if os.environ["GITHUB_REF_TYPE"] != "branch":
              raise SystemExit("Dispatch releases from a branch.")
          if os.environ["GITHUB_REF_NAME"] != "main" and not is_prerelease:
              raise SystemExit("Stable releases must run from main; branches may publish prereleases.")
          declared = tomllib.loads(Path("moleditpy/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          if declared != version:
              raise SystemExit(f"Version mismatch: dispatched {version}, but pyproject.toml declares {declared}.")
          tags = subprocess.check_output(["git", "tag", "--list"], text=True).splitlines()
          if version in tags or f"v{version}" in tags:
              raise SystemExit(f"Tag already exists for {version}.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_prerelease={str(is_prerelease).lower()}\n")

  # Runs before the Windows job so a broken macOS build cannot leave a release
  # tagged and pushed but never published.
  build-macos-app:
    needs: validate-release
    permissions:
      contents: write
    uses: ./.github/workflows/macos-app.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      artifact-name: release-macos-artifacts

  build-and-release:
    runs-on: windows-latest
    needs: [validate-release, build-macos-app]
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      WINDOWS_PORTABLE_NAME: MoleditPy_${{ inputs.version }}_win64_portable.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller pytest pytest-qt pytest-mock pytest-timeout
          python -m pip install -e moleditpy/

      - name: Run Tests
        env:
          MOLEDITPY_HEADLESS: "1"
          QT_QPA_PLATFORM: "offscreen"
        run: |
          python tests/run_all_tests.py --no-cov --no-report --unit --integration

      - name: Update Main Package Version
        shell: python
        run: |
          import os
          from pathlib import Path
          import re

          version = os.environ["APP_VERSION"]
          path = Path("moleditpy/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^version\s*=\s*["\'][^"\']+["\']',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update moleditpy/pyproject.toml")
          path.write_text(text, encoding="utf-8")

      - name: Update Installer Download URLs
        if: needs.validate-release.outputs.is_prerelease != 'true'
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          for path, flavor in [
              (Path("windows-installer/windows_installer.md"), "win64"),
              (Path("windows-installer/windows_installer-jp.md"), "win64"),
              (Path("macos-installer/macos_installer.md"), "macos"),
              (Path("macos-installer/macos_installer-jp.md"), "macos"),
          ]:
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  rf'releases/download/[^/]+/MoleditPy_[^_]+_{flavor}_',
                  f'releases/download/v{version}/MoleditPy_{version}_{flavor}_',
                  text,
              )
              path.write_text(text, encoding="utf-8")

      - name: Copy root README to packages
        shell: python
        run: |
          from pathlib import Path

          src = Path("README.md").read_text(encoding="utf-8")
          for dest_path in ("moleditpy/README.md",):
              dest = Path(dest_path)
              if not dest.exists() or dest.read_text(encoding="utf-8") != src:
                  dest.write_text(src, encoding="utf-8")
                  print(f"Updated {dest_path}")
              else:
                  print(f"No change: {dest_path}")

      - name: Install Main Package for Installer Build
        run: |
          python -m pip install -e moleditpy/

      - name: Build Main Package
        working-directory: moleditpy
        run: |
          python -m build --outdir ../dist/moleditpy

      - name: Build Windows Executable
        run: |
          pyinstaller --clean --noconfirm --distpath dist/pyinstaller windows-installer/script/MoleditPy.spec

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $exePath = "dist/pyinstaller/MoleditPy/MoleditPy.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "PyInstaller did not create $exePath"
            exit 1
          }
          # Launching it is the only check that catches a freeze missing an
          # import the module graph could not see (rdkit.ForceField, 4.8.3).
          $output = & $exePath --version | Select-Object -Last 1
          Write-Host $output
          if ($output -ne "MoleditPy ${env:APP_VERSION}") {
            Write-Error "Unexpected --version output from the frozen executable"
            exit 1
          }

      - name: Smoke Test Frozen Application
        run: python scripts/check_frozen_app.py dist/pyinstaller/MoleditPy/MoleditPy.exe --version "${{ env.APP_VERSION }}"

      - name: Create Portable Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows" | Out-Null
          Compress-Archive `
            -Path "dist/pyinstaller/MoleditPy/*" `
            -DestinationPath "dist/windows/${env:WINDOWS_PORTABLE_NAME}" `
            -Force

      - name: Build Windows Installer
        shell: pwsh
        env:
          MOLEDITPY_APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          $buildDir = (Resolve-Path "dist/pyinstaller/MoleditPy").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${env:APP_VERSION}" `
            "/DBuildDir=$buildDir" `
            "windows-installer/script/script.iss"
          Move-Item `
            -Path "windows-installer/script/Output/MoleditPy_${env:APP_VERSION}_win64_setup.exe" `
            -Destination "dist/windows/MoleditPy_${env:APP_VERSION}_win64_setup.exe" `
            -Force

      - name: Upload Main Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-main-package
          path: dist/moleditpy/*

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-artifacts
          path: dist/windows/*

      - name: Commit and Push Release Tag
        env:
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ($env:IS_PRERELEASE -ne "true") {
            git add moleditpy/pyproject.toml moleditpy/README.md windows-installer/script/script.iss windows-installer/script/MoleditPy.spec windows-installer/windows_installer.md windows-installer/windows_installer-jp.md macos-installer/script/MoleditPy.spec macos-installer/macos_installer.md macos-installer/macos_installer-jp.md
            if (git diff --staged --name-only) {
              git commit -m "Bump version to ${env:APP_VERSION}" -m "Assisted-by: GPT-6.1 Sol"
            }
            git push origin HEAD:${{ github.ref_name }}
          }
          git tag "v${env:APP_VERSION}"
          git push origin "v${env:APP_VERSION}"

  publish-and-create-release:
    runs-on: ubuntu-latest
    needs: [validate-release, build-and-release, build-macos-app]
    permissions:
      id-token: write
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}

    steps:
      - name: Download Main Package Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-main-package
          path: dist/moleditpy

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-artifacts
          path: dist/windows

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos-artifacts
          path: dist/macos

      - name: Publish Main Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/moleditpy

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          prerelease: ${{ needs.validate-release.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.validate-release.outputs.is_prerelease == 'true' && 'false' || 'true' }}
          files: |
            dist/moleditpy/*
            dist/windows/*
            dist/macos/*
          generate_release_notes: true

  zenodo-upload:
    if: ${{ inputs.zenodo && needs.validate-release.outputs.is_prerelease != 'true' }}
    runs-on: ubuntu-latest
    needs: [validate-release, publish-and-create-release]
    env:
      APP_VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          TAG="v${APP_VERSION}"
          gh release download "$TAG" --pattern "*.tar.gz" --pattern "*.whl" --dir dist --skip-existing || true
          curl -L -o "dist/source.tar.gz" "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "Downloaded assets:"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          python scripts/update_zenodo.py \
            --publish \
            --deposition-id 20463243 \
            --version-string "v${APP_VERSION}" \
            dist/*
