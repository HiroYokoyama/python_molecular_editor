name: macOS App Bundle

# Builds MoleditPy.app for Apple Silicon and zips it with ditto (which keeps the
# bundle's symlinks and ad-hoc signature intact).
#
# Called by release.yml / test-release.yml, and dispatchable on its own to build
# — or retro-fit — the bundle for an existing release.

on:
  workflow_call:
    inputs:
      version:
        description: "Version without a leading v, for example 1.2.3"
        required: true
        type: string
      ref:
        description: "Git ref to build. Defaults to the caller's commit."
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Name of the uploaded build artifact"
        required: false
        type: string
        default: release-macos-artifacts
  workflow_dispatch:
    inputs:
      version:
        description: "Version without a leading v, for example 1.2.3"
        required: true
        type: string
      ref:
        description: "Git ref to build. Defaults to the tag v<version>."
        required: false
        type: string
        default: ""
      attach_to_release:
        description: "Upload the bundle to the existing v<version> release"
        required: false
        type: boolean
        default: false
      artifact-name:
        description: "Name of the uploaded build artifact"
        required: false
        type: string
        default: release-macos-artifacts

permissions:
  contents: read

concurrency:
  group: macos-app-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-macos-app:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ inputs.version }}
      MOLEDITPY_APP_VERSION: ${{ inputs.version }}
      MACOS_BUNDLE_NAME: MoleditPy_${{ inputs.version }}_macos_arm64.zip

    steps:
      - name: Resolve Build Ref
        id: resolve
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            REF="${{ inputs.ref }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="v${APP_VERSION}"
          else
            REF="${{ github.sha }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building from $REF"

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Validate Version
        run: |
          if ! echo "$APP_VERSION" | grep -qE '^[0-9]+(\.[0-9]+){2}([a-zA-Z0-9.-]+)?$'; then
            echo "Invalid version: $APP_VERSION. Use a version without a leading v, for example 1.2.3" >&2
            exit 1
          fi

      - name: Verify Runner Architecture
        run: |
          ARCH="$(uname -m)"
          echo "Runner architecture: $ARCH"
          if [ "$ARCH" != "arm64" ]; then
            echo "The bundle is published as macos_arm64 but this runner is $ARCH." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Update Main Package Version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["APP_VERSION"]
          path = Path("moleditpy/pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^version\s*=\s*["\'][^"\']+["\']',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update moleditpy/pyproject.toml")
          path.write_text(text, encoding="utf-8")

      - name: Sync Linux Package
        run: |
          python scripts/sync_linux_version.py

      - name: Install Linux Package for Bundle Build
        run: |
          python -m pip install -e moleditpy-linux/

      - name: Build App Bundle
        run: |
          pyinstaller --clean --noconfirm \
            --distpath dist/pyinstaller \
            macos-installer/script/MoleditPy.spec

      - name: Verify App Bundle
        run: |
          APP="dist/pyinstaller/MoleditPy.app"
          if [ ! -x "$APP/Contents/MacOS/MoleditPy" ]; then
            echo "PyInstaller did not create $APP/Contents/MacOS/MoleditPy" >&2
            exit 1
          fi
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          if [ "$PLIST_VERSION" != "$APP_VERSION" ]; then
            echo "Info.plist says $PLIST_VERSION but this release is $APP_VERSION" >&2
            exit 1
          fi

      - name: Smoke Test App Bundle
        run: |
          OUTPUT="$(dist/pyinstaller/MoleditPy.app/Contents/MacOS/MoleditPy --version)"
          echo "$OUTPUT"
          # Catches a broken freeze (missing imports) and a version that did not
          # survive into the bundle, which would otherwise ship as "Unknown".
          if [ "$OUTPUT" != "MoleditPy (Linux) $APP_VERSION" ]; then
            echo "Unexpected --version output from the frozen bundle" >&2
            exit 1
          fi

      - name: Sign App Bundle
        run: |
          # Ad-hoc signature, applied after every modification to the bundle —
          # required for the app to launch at all on Apple Silicon.
          codesign --force --deep --sign - dist/pyinstaller/MoleditPy.app
          codesign --verify --deep --strict --verbose=2 dist/pyinstaller/MoleditPy.app

      - name: Create App Bundle Archive
        run: |
          mkdir -p dist/macos
          ditto -c -k --sequesterRsrc --keepParent \
            dist/pyinstaller/MoleditPy.app \
            "dist/macos/${MACOS_BUNDLE_NAME}"
          ls -la dist/macos

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/macos/*

      - name: Attach Bundle to Existing Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_to_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${APP_VERSION}" \
            "dist/macos/${MACOS_BUNDLE_NAME}" --clobber
