name: Zenodo Production Upload

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload (e.g. 3.6.0). If left empty, the latest release will be used."
        required: false
        type: string
      deposition_id:
        description: "Zenodo Deposition ID (to override the default production ID 20463243)."
        required: false
        type: string
        default: "20463243"
      draft_id:
        description: "Existing draft ID to resume without creating another version (optional)."
        required: false
        type: string
      draft:
        description: "Keep as a draft (do not publish)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  zenodo-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          
          # Resolve the target tag based on the trigger event
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "No tag specified, fetching latest release tag..."
              TAG=$(gh release view --json tagName --template '{{.tagName}}')
            fi
          fi
          
          echo "Processing tag: $TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV

          # Download uploaded release assets (*.tar.gz and *.whl files)
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".tar.gz") or endswith(".whl"))')
          while IFS= read -r asset; do
            [ -z "$asset" ] || gh release download "$TAG" --pattern "$asset" --dir dist --skip-existing
          done <<< "$ASSETS"

          # Download the source code tarball archive
          curl --fail --location --retry 3 -o "dist/source.tar.gz" "https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"

          # List the files to verify
          echo "Downloaded assets:"
          ls -la dist/

      - name: Upload and Publish to Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          INPUT_DEPOSITION: ${{ inputs.deposition_id }}
          INPUT_DRAFT_ID: ${{ inputs.draft_id }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          args=()
          if [ -n "$INPUT_DEPOSITION" ]; then
            [[ "$INPUT_DEPOSITION" =~ ^[0-9]+$ ]] || exit 1
            args+=(--deposition-id "$INPUT_DEPOSITION")
          fi
          if [ -n "$INPUT_DRAFT_ID" ]; then
            [[ "$INPUT_DRAFT_ID" =~ ^[0-9]+$ ]] || exit 1
            args+=(--draft-id "$INPUT_DRAFT_ID")
          fi
          if [ "$INPUT_DRAFT" != "true" ]; then
            args+=(--publish)
          fi
          python scripts/update_zenodo.py "${args[@]}" --version-string "$TAG" dist/*
