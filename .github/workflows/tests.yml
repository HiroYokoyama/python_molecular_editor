name: MoleditPy Tests

on:
  push:
    # 'dev-*' covers the dev-N.N.N release branches, which otherwise got no CI.
    branches: [ main, master, dev, 'dev-*' ]
  pull_request:
    branches: [ main, master, dev, 'dev-*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
            # Exactly one matrix entry measures and uploads coverage, so the
            # other nine are not slowed down and Codecov gets a single report
            # per commit instead of ten partial ones. Windows runs all suites
            # against the same moleditpy package, matching local coverage.
            coverage: true
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb libgl1-mesa-dri

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-qt pytest-mock pytest-timeout
        # Needed only by the coverage matrix entry, but installing it
        # everywhere keeps the dependency list identical across the matrix.
        pip install pytest-cov
        # Install local package + dependencies from pyproject.toml
        pip install -e moleditpy/

    - name: Run Tests
      if: ${{ !matrix.coverage }}
      env:
        MOLEDITPY_HEADLESS: "1"
        QT_QPA_PLATFORM: "offscreen"
      run: |
        # No suite flags: run_all_tests.py runs all four suites (unit, integration, E2E, GUI)
        python tests/run_all_tests.py --no-cov --no-report

    - name: Run Tests with Coverage
      if: ${{ matrix.coverage }}
      env:
        MOLEDITPY_HEADLESS: "1"
        QT_QPA_PLATFORM: "offscreen"
      run: |
        # Same four suites, but with coverage on. --no-report still skips the
        # markdown/HTML report generation; the runner leaves a combined
        # .coverage file, which Codecov needs as XML.
        python tests/run_all_tests.py --no-report
        python -m coverage xml -o coverage.xml

    - name: Upload coverage reports to Codecov
      if: ${{ matrix.coverage }}
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils xvfb libgl1-mesa-dri

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Pinned toolchain (see requirements-lint.txt) so a new linter release
        # cannot turn this job red without a change to this repository.
        pip install -r requirements-lint.txt
        # Install local package + dependencies from pyproject.toml
        pip install -e moleditpy/

    - name: Run Ruff
      run: |
        # `ruff format` is part of the documented workflow and the tree is
        # already clean at the default line length, so gate on it too.
        ruff format --check moleditpy/src tests
        ruff check moleditpy/src/moleditpy/

    - name: Run Mypy
      run: |
        # The tree has Windows-, macOS- and Linux-only branches, and mypy
        # defaults to the platform it runs on. Check all three so a
        # Windows-only regression cannot pass a Linux-only CI job.
        for plat in win32 linux darwin; do
          echo "--- mypy --platform $plat ---"
          mypy --platform "$plat"
        done

    - name: Run Pylint
      run: |
        pylint moleditpy/src/moleditpy/ --errors-only
