[mypy]
# Oldest interpreter the package supports (pyproject: requires-python >=3.9).
# Checking against the floor is deliberate: it catches syntax/stdlib usage that
# would break on 3.9 even though CI's lint job itself runs on a newer Python.
python_version = 3.9

# Default target so a bare `mypy` (no arguments) checks the right tree.
files = moleditpy/src/moleditpy
exclude = (?x)(^moleditpy-linux/|/moleditpy-linux/)

warn_unused_configs = True

# The source tree is 100% annotated (962/962 defs), so the strict-family checks
# below all pass today at zero cost. Keep them on so that stays true.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
strict_equality = True
warn_redundant_casts = True
warn_return_any = True
warn_no_return = True
extra_checks = True

# Deliberately NOT enabled (measured against the current tree):
#   disallow_any_generics   -> 39 errors (bare `dict`/`set`/`Callable` annotations,
#                              mostly plugins/plugin_manager.py and plugin_interface.py)
#   disallow_subclassing_any -> 1 error (ui/custom_qt_interactor.py subclasses
#                              pyvistaqt.QtInteractor, which is untyped)
#   warn_unused_ignores      -> 8 errors, but these are environment-dependent:
#                              a `type: ignore` that is unused with one PyQt6/RDKit
#                              build can be required with another, so enabling this
#                              makes CI fail for reasons unrelated to the change.
# Turning the first two on is a reasonable follow-up; the third is not recommended.

# winreg is Windows-only in typeshed, so `mypy --platform linux/darwin` reports
# every winreg attribute in this module as missing. The module guards its use at
# runtime with `try: import winreg / except ImportError` plus a
# `platform.system() == "Windows"` check, which mypy cannot narrow on. The
# dispatch must stay on platform.system(): tests/unit/test_system_utils.py mocks
# it to exercise the macOS and Linux branches, and moving to sys.platform makes
# the Windows branch unconditional under test (8 failures). Scoped to one module
# and one error code rather than silencing the platform check globally.
[mypy-moleditpy.utils.system_utils]
disable_error_code = attr-defined

[mypy-rdkit.*]
ignore_missing_imports = True

[mypy-vtk.*]
ignore_missing_imports = True

[mypy-vtkmodules.*]
ignore_missing_imports = True

[mypy-pyvista.*]
ignore_missing_imports = True

[mypy-pyvistaqt.*]
ignore_missing_imports = True

[mypy-sip]
ignore_missing_imports = True

[mypy-openbabel.*]
ignore_missing_imports = True

# tifffile uses PEP 695 syntax that mypy cannot parse under python_version = 3.9
[mypy-tifffile.*]
follow_imports = skip
ignore_missing_imports = True
