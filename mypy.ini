[mypy]
# The version mypy type-checks *as* -- not the interpreter it runs on.
#
# This was 3.9 (the package's requires-python floor), but that target cannot be
# type-checked against the current dependency set: mypy parses the source and
# stubs of every followed import at this version, and the libraries have moved
# on. Two CI failures came from exactly this, each aborting before a single line
# of our own code was checked:
#     numpy/__init__.pyi:737     Type statement is only supported in 3.12+
#     matplotlib/_afm.py:374     Pattern matching is only supported in 3.10+
# Those versions of numpy and matplotlib require Python >= 3.10 themselves, so
# "3.9 + these stubs" is a combination that cannot exist at runtime either.
#
# Set to the local development interpreter (3.13), which is also what makes the
# modern stubs parse. Measured cost of the move: none today -- with numpy and
# matplotlib skipped, this tree is clean at python_version = 3.9 as well, so no
# live error is being hidden. What is given up is the guard against a *future*
# 3.10+ stdlib call (tomllib, itertools.batched, ...) reaching a 3.9 user.
# That floor is still covered by running the real thing: tests.yml runs the full
# suite on ubuntu/py3.9 and full-gui-tests.yml probes launch on py3.9, and
# ruff.toml keeps target-version = py39 for syntax-level checks.
#
# If a future dependency's stubs need a newer target still, raise this -- do not
# pin the dependency to an old version to keep an old target alive.
python_version = 3.13

# Default target so a bare `mypy` (no arguments) checks the right tree.
files = moleditpy/src/moleditpy
exclude = (?x)(^moleditpy-linux/|/moleditpy-linux/)

warn_unused_configs = True

# The source tree is 100% annotated (962/962 defs), so the strict-family checks
# below all pass today at zero cost. Keep them on so that stays true.
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
check_untyped_defs = True
no_implicit_optional = True
strict_optional = True
strict_equality = True
warn_redundant_casts = True
warn_return_any = True
warn_no_return = True
extra_checks = True
disallow_any_generics = True
disallow_subclassing_any = True

# disallow_untyped_calls is deliberately off. Every hit it produced was a call
# into an untyped third-party callable (rdkit's MolToInchi / MolToInchiKey /
# NumRadicalElectrons / FindMolChiralCenters, pyvistaqt's event handlers), never
# a first-party one -- disallow_untyped_defs already guarantees that, since the
# tree is 100% annotated. Keeping it on would only add noise about code we do
# not own.
#
# Deliberately NOT enabled:
#   warn_unused_ignores -> 12 errors, and they are environment-dependent. A
#     `type: ignore` that is unused against one PyQt6/rdkit/pyvista build is
#     required against another -- the count here grew from 8 to 12 simply by
#     moving to the CI dependency set. Enabling it would make the lint job fail
#     for reasons unrelated to the change under review.

# winreg is Windows-only in typeshed, so `mypy --platform linux/darwin` reports
# every winreg attribute in this module as missing. The module guards its use at
# runtime with `try: import winreg / except ImportError` plus a
# `platform.system() == "Windows"` check, which mypy cannot narrow on. The
# dispatch must stay on platform.system(): tests/unit/test_system_utils.py mocks
# it to exercise the macOS and Linux branches, and moving to sys.platform makes
# the Windows branch unconditional under test (8 failures). Scoped to one module
# and one error code rather than silencing the platform check globally.
[mypy-moleditpy.utils.system_utils]
disable_error_code = attr-defined

[mypy-rdkit.*]
ignore_missing_imports = True

[mypy-vtk.*]
ignore_missing_imports = True

[mypy-vtkmodules.*]
ignore_missing_imports = True

# pyvista ships py.typed, but defines many Plotter methods as
#     @wraps(Renderer.reset_camera)
#     def reset_camera(self, *args, **kwargs) -> None: ...
# typeshed types functools.wraps as returning _Wrapped[...], so the attribute
# loses its bound-method signature and every call site is reported as either
# "Missing positional argument self" or an argument-type mismatch against
# BasePlotter. Not fixable from the calling side; the affected lines carry
# narrow per-code ignores referring back to this note.
[mypy-pyvista.*]
ignore_missing_imports = True

[mypy-pyvistaqt.*]
ignore_missing_imports = True

# CustomQtInteractor subclasses pyvistaqt.QtInteractor, which ships without
# full type information and is therefore seen as Any by mypy. The global
# disallow_subclassing_any = True would flag this; suppress it for the one
# module that owns the subclass so that no type: ignore is needed in the
# application source.
# (CI does not install pyvistaqt in the lint job, so ignore_missing_imports
# already hides the error there; this section only takes effect locally.)
[mypy-moleditpy.ui.custom_qt_interactor]
disallow_subclassing_any = False

[mypy-sip]
ignore_missing_imports = True

[mypy-openbabel.*]
ignore_missing_imports = True
