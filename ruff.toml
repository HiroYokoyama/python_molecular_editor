# Ruff configuration for the MoleditPy main application.
#
# Kept at the repo root next to mypy.ini and .pylintrc so all three linters are
# configured in one place. moleditpy/pyproject.toml carries no [tool.ruff]
# section, so ruff walks up to this file.

# Must be set explicitly. Without it ruff reports
# `linter.unresolved_target_version = none` and falls back to its own default
# instead of the package's requires-python (">=3.9, <3.15"), which silently
# changes which pyupgrade-style rules apply.
target-version = "py39"

# Left at ruff's default (88) on purpose: `ruff format` is already part of the
# documented workflow (CLAUDE.md) and all 69 source files are formatted at 88.
# Raising it to e.g. 120 would silently reflow 56 of them on the next format run.
# line-length = 88

extend-exclude = ["moleditpy-linux", "moleditpy/src/moleditpy/assets"]

[lint]
# All clean on the current tree, so CI gates on them.
#   B  (flake8-bugbear) found a real defect: an `except` tuple ended in
#      `vtk.vtkException if hasattr(vtk, "vtkException") else Exception`, and
#      since VTK has no vtkException it always resolved to Exception -- the
#      three narrow types listed above it were decorative.
select = ["E4", "E7", "E9", "F", "B", "C4"]

# Measured counts if the rule set is widened further (ruff 0.14.5, target py39).
# Each still needs a one-time code pass:
#   RUF  32   ruff-specific   (13 are ambiguous-unicode in Japanese docstrings)
#   RET  10   superfluous-else-return
#   SIM  38   collapsible-if etc.
#   I    56   unsorted-imports          (autofixable)
#   UP  689   pyupgrade                 (autofixable; 69x UP009 redundant
#                                        "# -*- coding: utf-8 -*-", 298x UP006)
#   PTH 151   os.path -> pathlib
#   E501 313  line-too-long -- do NOT enable: the formatter owns line breaking,
#                              and these are long strings/comments it cannot split.
# Recommended order: I -> UP -> RET/SIM -> RUF -> PTH.

[lint.per-file-ignores]
"tests/**" = ["E402"]
